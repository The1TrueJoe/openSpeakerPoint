name: Build Control4 driver

# Builds the SpeakerPoint .c4z with Control4's driver packager and attaches it to a
# release. Separate from the firmware image build (build.yml) - different toolchain,
# much faster.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "drivers/control4/**"
      - ".github/workflows/driver.yml"
  pull_request:
    paths:
      - "drivers/control4/**"
      - ".github/workflows/driver.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Driver self-check (Lua 5.1, as on the controller)
        working-directory: drivers/control4
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.1 && lua5.1 test.lua
      # Pinned to the packager's last (archived) commit: the v1 tag predates the
      # version/updateModified inputs and silently ignores them.
      - uses: control4/drivers-driverpackager@c491b3e7e42c012fd2aad8aad3e0b9851e8488cc
        with:
          projectDir: drivers/control4
          c4zproj: speakerpoint.c4zproj
          outputDir: ./out
          version: ${{ github.run_number }}
          updateModified: true
      - uses: actions/upload-artifact@v4
        with:
          name: openspeakerpoint-c4z
          path: drivers/control4/out/openspeakerpoint.c4z
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: [driver]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openspeakerpoint-c4z
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/openspeakerpoint.c4z --clobber --repo "${{ github.repository }}"
