name: Build firmware image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "br-external/**"
      - "apps/**"
      - "build.sh"
      - "Dockerfile"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "br-external/**"
      - "apps/**"
      - "build.sh"
      - "Dockerfile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold-cache first run does a full Buildroot toolchain build and can
    # take several hours. Once the dl/ and output caches below are warm,
    # subsequent runs are much faster.
    timeout-minutes: 360
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build firmware and export images
        run: docker build --target artifacts --output type=local,dest=./output .

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: speakerpoint-images
          path: |
            output/images/*
          if-no-files-found: error
