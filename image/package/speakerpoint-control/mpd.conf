# MPD on the SpeakerPoint. Scans the auto-mounted USB drive and decodes to
# the AC97 codec; speakerpoint-control drives it over 127.0.0.1:6600.
#
# All writable state lives on tmpfs - the rootfs is read-only squashfs, and
# the library is cheap to re-index from the drive on boot.

music_directory     "/media/usb"
playlist_directory  "/tmp/mpd/playlists"
db_file             "/tmp/mpd/database"
state_file          "/tmp/mpd/state"
pid_file            "/run/mpd.pid"
log_file            "syslog"
user                "root"

bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
auto_update_depth   "6"
restore_paused      "yes"

# One exclusive ALSA sink -> STAC9758 -> routed to RCA and/or the D2 amp by
# speakerpoint-audio-apply. MPD must not touch the mixer: output level is
# handled downstream (analog Master for RCA, D2 master-volume for the amp),
# and there is no software mixer (see /etc/asound.conf).
audio_output {
    type        "alsa"
    name        "SpeakerPoint"
    device      "default"
    mixer_type  "none"
}
