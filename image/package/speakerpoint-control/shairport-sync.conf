// AirPlay 1 receiver config. Plays to the shared dmix "default" so it
// coexists with USB media on the single AC97 codec.

general = {
	// No fixed name: defaults to "%H" (hostname), so each unit's AirPlay
	// name tracks its speakerpoint-<mac> hostname automatically.
	output_backend = "alsa";
	mdns_backend = "tinysvcmdns";
	drift_tolerance_in_seconds = 0.010;
};

alsa = {
	output_device = "default";
	// No mixer_control_name at all (not even empty): its presence, even as
	// "", makes shairport-sync look up a hardware mixer element by that
	// name and can fail startup when none matches. Omitting it is the
	// documented way to get software-only volume, which is what we want -
	// level is handled externally by speakerpoint-audio-apply.
};

sessioncontrol = {
	run_this_before_play_begins = "/usr/bin/airplay-hook begin";
	run_this_after_play_ends = "/usr/bin/airplay-hook end";
	wait_for_completion = "no";
};

metadata = {
	enabled = "yes";
	include_cover_art = "no";
	pipe_name = "/tmp/shairport-sync-metadata";
};
