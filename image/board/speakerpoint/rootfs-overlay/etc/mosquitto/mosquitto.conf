# The SpeakerPoint's own MQTT broker (same shape as openHC's).
#
# speakerpoint-control is a client of it on loopback; anything on the LAN (a
# house controller, Home Assistant, a test script) connects on 1883 and reads
# the retained state under openspeakerpoint/<hostname>/state/ or publishes to
# .../cmd/. See apps/speakerpoint-control/src/mqtt.h for the topics.
#
# Anonymous on a trusted LAN, like the REST API on :8081. Nothing is persisted:
# the daemon republishes every retained value when it (re)connects, and the
# box has no writable storage to spend on it.
allow_anonymous true

listener 1883 0.0.0.0

# No websockets listener yet: mosquitto 2.1's websockets need OpenSSL, which
# does not fit osp-rootfs, and declaring one without support stops the broker.
persistence false
log_dest syslog
