# "default" is plug straight over the raw codec - deliberately NOT dmix.
#
# dmix needs the driver to report playback position accurately via mmap, and
# this one can't: ep93xx-ac97 logs "Failed to get DMA channel capabilities,
# falling back to period counting" at probe. Under dmix the device opens and
# accepts audio but plays silence (confirmed on hardware - speaker-test
# negotiates dmix's fixed 1024-frame period and outputs nothing, where the
# raw device negotiates 8..8192 and works).
#
# So the codec is exclusive: one source at a time. The daemon enforces that
# by releasing the device before handing it to another source (see
# player_release / airplay-hook), rather than mixing in software.
#
# plug is still used for automatic rate/format conversion, so a 44.1kHz MP3
# and a 48kHz AirPlay stream both work against the codec's fixed link rate.

pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}

pcm.sp_capture {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
